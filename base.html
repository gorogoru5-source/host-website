<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}CloudBot Host{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav class="nav"><a class="brand" href="/">CloudBot Host</a><div><a href="/dashboard">Dashboard</a><a href="/bots">Bots</a><a href="/billing">Billing</a>{% if session.get("uid") %}<a href="/logout">Logout</a>{% else %}<a href="/login">Login</a>{% endif %}</div></nav>
<main class="container">{% with messages=get_flashed_messages() %}{% if messages %}<div class="flash">{{ messages[0] }}</div>{% endif %}{% endwith %}{% block content %}{% endblock %}</main>
</body></html>
