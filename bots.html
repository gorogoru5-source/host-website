{% extends "base.html" %}{% block title %}My Bots{% endblock %}{% block content %}<div class="row"><h1>My Bots</h1><a class="btn primary" href="/bots/create">+ Create Bot</a></div>{% if bots %}<div class="grid">{% for bot in bots %}<div class="card"><span class="status {{ bot.status }}">{{ bot.status }}</span><h3>{{ bot.name }}</h3><p>Entrypoint: {{ bot.entrypoint }}</p><p>Plan: {{ bot.plan }}</p></div>{% endfor %}</div>{% else %}<div class="empty">No bots yet.</div>{% endif %}{% endblock %}
